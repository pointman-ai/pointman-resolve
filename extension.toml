# DaVinci Resolve: the Python node's bridge (src/messageboard/agent/resolve.py) as an extension, with
# what that node did around it (publishing renders and stills, notes as markers, auto renders), so
# the Rust node only runs it (MB-354). Format: docs/dev/extensions.md.

[extension]
id = "resolve"
name = "DaVinci Resolve"
version = "0.6.3"
publisher = "aurelio"
summary = "Preview renders and stills of your Resolve timelines, board notes as timeline markers, markers that call agents, and the timeline as data for agents."
node = ">=0.1,<1"
platforms = ["macos-arm64", "macos-x86_64"]

[run]
command = ["python", "-m", "pointman_resolve"]
runtime = "python3.12"

# Guidance for every agent woken on a machine where this extension is on: how to edit a person's Resolve
# timeline (their call, check in Resolve's own frames, keep it clean, colour by block type). Needs Pointman
# release 9 or later (a node extension carrying a [behavior]).
[behavior]
skill = "SKILLS.md"
clients = ["claude", "codex", "gemini"]
files = ["skills"]

[detect]
macos = ["/Applications/DaVinci Resolve/DaVinci Resolve.app"]

[permissions]
drives_apps = ["DaVinci Resolve"]
gpu = true

[settings]
type = "object"

[settings.properties.preview_height]
type = "integer"
title = "Preview height"
description = "Previews are rendered at this height, or the timeline's if it's smaller."
enum = [480, 720, 1080]
default = 720

[settings.properties.auto_render_idle_minutes]
type = "integer"
title = "Render a preview when idle (minutes)"
description = "After the edit changes and the Mac has been idle this long. 0 is off."
minimum = 0
default = 0

[settings.properties.marker_calls]
type = "boolean"
title = "Markers call agents"
description = "A marker whose name or note starts with @pm, @pointman or @<agent> is posted on the board for that agent (routes in ~/.pointman-resolve/routes.toml; a project with no route goes where the last marker went), and turns cyan, then green once it's done."
default = true

[settings.properties.markers]
type = "boolean"
title = "Notes as markers"
description = "Notes on a Resolve preview become markers on its timeline: purple while open, green once resolved."
default = true

[[commands]]
kind = "resolve.render"
title = "Render a preview"
params = { type = "object", properties = { timeline = { type = "string", description = "The timeline's name; the open one if left out." }, height = { type = "integer", minimum = 144, maximum = 2160 }, thread_id = { type = "integer", description = "Post it in this thread; otherwise in the project's Resolve previews thread." } }, additionalProperties = false }
lane = "resolve"
cancellable = true
ready_when = "connected"
outputs = ["video"]

[[commands]]
kind = "resolve.still"
title = "Grab a still"
params = { type = "object", properties = { thread_id = { type = "integer" } }, additionalProperties = false }
lane = "resolve"
ready_when = "connected"
outputs = ["image"]

[[commands]]
kind = "resolve.marker"
title = "Mirror a note as a marker"
params = { type = "object", required = ["note", "project", "timeline"], properties = { note = { type = "object" }, project = { type = "string" }, timeline = { type = "string" } } }
lane = "resolve"
ready_when = "connected"

[[commands]]
kind = "resolve.marker_done"
title = "Mark a marker's call done"
params = { type = "object", required = ["post"], properties = { post = { type = "integer", description = "The post the marker became." }, by = { type = "string" } }, additionalProperties = false }
lane = "resolve"
ready_when = "connected"

[[commands]]
kind = "resolve.set_fallback"
title = "Set where unrouted markers go"
params = { type = "object", properties = { thread = { type = "integer", description = "The board thread markers from a Resolve project with no route are posted in." }, agent = { type = "string", description = "Who @pm / @pointman means there (a handle); the current one if left out." }, by = { type = "string" } }, additionalProperties = false }

[[commands]]
kind = "resolve.snapshot"
title = "Snapshot the timeline"
params = { type = "object", properties = { otio = { type = "boolean", default = true, description = "Also save Resolve's OTIO export of the timeline beside it." } }, additionalProperties = false }
lane = "resolve"
ready_when = "connected"

[[commands]]
kind = "resolve.diff"
title = "Compare two timeline snapshots"
params = { type = "object", properties = { timeline = { type = "string", description = "The timeline's name; the one snapshotted last if left out." }, a = { type = "string", description = "The earlier snapshot's file name (snapshot-<utc>.json); the one before b if left out." }, b = { type = "string", description = "The later snapshot's file name; the latest if left out." }, full = { type = "boolean", default = false, description = "Every entry, rather than the first 50 of each list." } }, additionalProperties = false }

[[commands]]
kind = "resolve.check"
title = "Check a snapshot against its OTIO"
params = { type = "object", properties = { timeline = { type = "string" }, snapshot = { type = "string", description = "The snapshot's file name; the latest if left out." } }, additionalProperties = false }

[[commands]]
kind = "resolve.shadow"
title = "Shadow-render a range"
params = { type = "object", required = ["from", "to"], properties = { from = { type = ["string", "integer"], description = "Timeline frame (0 = its first), or a time: 'mm:ss.xx', '12.5s'." }, to = { type = ["string", "integer"] }, width = { type = "integer", minimum = 320, maximum = 1920, default = 960 }, thread_id = { type = "integer", description = "Post the video in this thread." } }, additionalProperties = false }
lane = "resolve"
ready_when = "connected"
cancellable = true
outputs = ["video"]

[[commands]]
kind = "resolve.frame_check"
title = "Check a frame in Resolve against the shadow render"
params = { type = "object", required = ["frame"], properties = { frame = { type = ["string", "integer"], description = "Timeline frame (0 = its first), or a time: 'mm:ss.xx', '12.5s'." }, min_psnr = { type = "number", default = 30 }, wait = { type = "number", default = 3, description = "Seconds the timeline must stay still before the playhead is moved." }, thread_id = { type = "integer", description = "Post the comparison image in this thread." } }, additionalProperties = false }
lane = "resolve"
ready_when = "connected"
outputs = ["image"]

[[commands]]
kind = "resolve.calibrate"
title = "Measure Crop/Pan/Tilt px per unit"
params = { type = "object", properties = { frame = { type = ["string", "integer"], description = "A frame with a moved or cropped clip; picked from the timeline if left out." }, dry_run = { type = "boolean", default = false }, wait = { type = "number", default = 3 }, thread_id = { type = "integer", description = "Post the comparison image in this thread." } }, additionalProperties = false }
lane = "resolve"
ready_when = "connected"
outputs = ["image"]

[[tools]]
name = "resolve_render"
command = "resolve.render"
description = "Render a Resolve timeline (the open one, or one by name) to a small preview with its timeline layout, and post it in the thread given or the project's Resolve previews thread. Takes minutes; returns the request's id."

[[tools]]
name = "resolve_still"
command = "resolve.still"
description = "Grab the frame under Resolve's playhead as a PNG and post it."
returns = "result"

[[tools]]
name = "resolve_marker_done"
command = "resolve.marker_done"
description = "When you've done what a Resolve marker asked (a post that starts 'Resolve marker at'), turn the marker green in Resolve: give that post's id. Only the marker's colour changes."
returns = "result"

[[tools]]
name = "resolve_set_fallback"
command = "resolve.set_fallback"
description = "Where markers from a Resolve project with no route in routes.toml are posted: a board thread, and the agent @pm means there. By default it's where the last marker from a routed project went. Give thread (and agent) to move it; give neither to see it. Reads and writes a file only."
returns = "result"

[[tools]]
name = "resolve_snapshot"
command = "resolve.snapshot"
description = "Read the timeline open in Resolve, without changing anything: every track, item (place, length, in-point, source, transform, fades, speed, grade nodes), marker, and our own edits since the last snapshot, saved as snapshot-<utc>.json with Resolve's OTIO export beside it. Returns the files' paths and counts. Takes a few seconds."
returns = "result"

[[tools]]
name = "resolve_diff"
command = "resolve.diff"
description = "What changed in a Resolve timeline between two snapshots (by default its latest two): items kept, changed, moved, trimmed, new (with the clip each was cut from) and gone, markers, and which changes were ours. Reads files only."
returns = "result"

[[tools]]
name = "resolve_check"
command = "resolve.check"
description = "Check a timeline snapshot (by default the latest) against the OTIO export taken with it, item by item: place, length, in-point, transforms, transitions and markers."
returns = "result"

[[events]]
name = "resolve.status"
description = "connected (and why not), Resolve's version, the page, the open project and timeline (name, fps, duration, timecode, tracks, markers), and whether it's rendering."

[[files]]
extensions = [".drp"]
open_with = "DaVinci Resolve"

[[tools]]
name = "resolve_frame_check"
command = "resolve.frame_check"
description = "After changing position, zoom, crop, colour or a transition: Resolve's own picture of one timeline frame against the shadow render of it, with the PSNR, the box where they differ, and the clips there (with their Zoom/Pan/Tilt/crops). Moves the playhead only once the timeline has been still for `wait` seconds, and puts it back; while someone is working it retries later. Returns an image: Resolve | shadow | difference."
returns = "result"

[[tools]]
name = "resolve_calibrate"
command = "resolve.calibrate"
description = "Measure how many pixels one Crop/Pan/Tilt unit is at this timeline's resolution (2 on 1920x1080), from Resolve's own frame: the candidate whose shadow render matches best. Read-only on the timeline (it moves the playhead the same guarded way as resolve_frame_check). Stored per resolution; later snapshots carry it as timeline.px_per_unit."
returns = "result"

[[tools]]
name = "resolve_shadow"
command = "resolve.shadow"
description = "Watch any range of the open Resolve timeline (up to 3 min a request; it takes about a third of real time and holds up marker posts meanwhile) without touching Resolve: every track composited from the source files and the audio mixed, posted as a video. The playhead and page don't move, so it's safe while someone edits. Grades, transitions, speed changes and titles aren't drawn yet (listed in not_drawn): for those, check with resolve_frame_check."
returns = "result"
